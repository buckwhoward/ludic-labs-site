<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:inherit}a:hover{color:inherit}:focus-visible{outline:2px solid #DFFF00;outline-offset:3px}</style>
</helmet>
<footer role="contentinfo" style="background:#151515;color:#F4F1E9;font-family:Figtree,Helvetica,Arial,sans-serif;padding:clamp(56px,8vw,96px) clamp(20px,4vw,56px) 32px;overflow:hidden;container-type:inline-size">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px 48px;padding-bottom:clamp(40px,6vw,72px);border-bottom:1px solid rgba(244,241,233,.16)">
    <nav aria-label="Footer" style="display:flex;flex-direction:column;gap:12px;min-width:160px">
      <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#B9BAB4;margin-bottom:8px">Navigate</span>
      <a href="/services" style="font-size:18px;font-weight:500;text-decoration:none;color:#F4F1E9" style-hover="color:#DFFF00">Services</a>
      <a href="/about" style="font-size:18px;font-weight:500;text-decoration:none;color:#F4F1E9" style-hover="color:#DFFF00">About</a>
      <a href="/contact" style="font-size:18px;font-weight:500;text-decoration:none;color:#F4F1E9" style-hover="color:#DFFF00">Let’s Talk</a>
    </nav>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:360px">
      <span style="font-family:'Geist Mono',ui-monospace,monospace;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:#B9BAB4;margin-bottom:8px">Ludic Labs</span>
      <p style="margin:0;font-size:17px;line-height:1.5;color:#F4F1E9;text-wrap:pretty">A creative marketing agency for brands ready to move people—and move forward.</p>
      <a href="/contact" style="display:inline-flex;align-items:center;gap:10px;margin-top:8px;width:fit-content;height:48px;padding:0 22px;background:#DFFF00;color:#151515;font-weight:600;text-decoration:none;transition:transform .2s" style-hover="transform:translateX(4px)">Start a Conversation <span aria-hidden="true">→</span></a>
    </div>
  </div>
  <div aria-hidden="true" style="font-family:Syne,Helvetica,sans-serif;font-weight:800;font-size:clamp(40px,11.8cqw,250px);line-height:.9;letter-spacing:-0.05em;margin:clamp(32px,5vw,64px) 0 0 -0.04em;display:flex;align-items:flex-start;gap:.06em;white-space:nowrap">Ludic Labs<span style="display:block;width:.11em;height:.11em;background:#DFFF00;margin-top:.14em"></span></div>
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:24px;font-family:'Geist Mono',ui-monospace,monospace;font-size:15px;letter-spacing:.04em;color:#B9BAB4">
    <span>© 2026 Ludic Labs. All rights reserved.</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;600px&quot;}}"></script>
</body>
</html>
